name: Setup Lavapipe Vulkan
description: Export Vulkan environment variables for Mesa Lavapipe and validation layers

runs:
  using: composite
  steps:
    - name: Resolve Vulkan paths
      shell: bash
      run: |
        set -euo pipefail
        # Pin Lavapipe (mesa.drivers) and the Khronos validation layers to the
        # same nixpkgs revision devenv.lock pins. The bare 'nixpkgs#' shorthand
        # resolves to the floating flake registry and lets the validation
        # layers drift independently of the project pin, which surfaced latent
        # Vulkan errors (viewport 0x0, render-pass srcAccessMask mismatches)
        # that broke the integration-test gate. Read the rev from devenv.lock
        # so there is a single source of truth.
        nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' devenv.lock)
        LVP_PATH=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/${nixpkgs_rev}#mesa.drivers")/share/vulkan/icd.d/lvp_icd.x86_64.json
        LAYER_PATH=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/${nixpkgs_rev}#vulkan-validation-layers")/share/vulkan/explicit_layer.d
        {
          echo "VK_ICD_FILENAMES=$LVP_PATH"
          echo "VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation"
          echo "VK_LAYER_PATH=$LAYER_PATH"
          echo "VK_LAYER_SETTINGS_PATH=$GITHUB_WORKSPACE/.github/vulkan/vk_layer_settings.txt"
          echo "VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_BEST_PRACTICES_EXT"
          echo "VK_LAYER_LOGGING=stderr"
        } >> "$GITHUB_ENV"
        {
          echo "### Lavapipe Vulkan validation"
          echo "- ICD: $LVP_PATH"
          echo "- Layer path: $LAYER_PATH"
          echo "- Layer: VK_LAYER_KHRONOS_validation"
          echo "- Best practices: enabled"
        } >> "$GITHUB_STEP_SUMMARY"
