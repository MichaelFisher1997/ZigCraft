name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to build/test"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code_changes: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code_changes }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'

      - name: Detect build-relevant changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code_changes:
              - 'src/**'
              - 'modules/**'
              - 'libs/**'
              - 'assets/shaders/**'
              - 'scripts/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/actions/setup-nix/**'
              - '.github/actions/setup-zig-cache/**'
              - '.github/actions/setup-lavapipe/**'
              - '.github/vulkan/**'
              - '.github/workflows/build.yml'

  fmt:
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check Zig formatting
        run: nix develop .#ci-unit --command zig fmt --check src/ modules/

  build:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, fmt]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip build for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping binary build."

      - name: Setup Nix
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-nix

      - name: Build
        if: needs.changes.outputs.code_changes == 'true'
        run: nix build -L

      - name: Prepare Artifact
        if: needs.changes.outputs.code_changes == 'true'
        run: |
          mkdir -p dist
          cp -L result/bin/zigcraft dist/zigcraft-linux

      - name: Upload Artifact
        if: needs.changes.outputs.code_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zigcraft
          path: dist/
          retention-days: 7

  unit-test-matrix:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, build]
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip unit tests for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping unit tests."

      - name: Setup Nix
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-nix

      - name: Setup Zig cache
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-unit-${{ matrix.optimize }}

      - name: Run unit tests (${{ matrix.optimize }})
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: Unit Test (${{ matrix.optimize }})
          timeout: 25m
          log-file: unit-test-${{ matrix.optimize }}.log
          command: nix develop .#ci-unit --command zig build -Doptimize=${{ matrix.optimize }} test

      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log-${{ matrix.optimize }}
          path: unit-test-${{ matrix.optimize }}.log
          if-no-files-found: ignore
          retention-days: 7

  unit-test:
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: [unit-test-matrix]
    if: always()
    steps:
      - name: Require unit test matrix success
        run: |
          if [ "${{ needs.unit-test-matrix.result }}" != "success" ]; then
            echo "Unit test matrix result: ${{ needs.unit-test-matrix.result }}" >&2
            exit 1
          fi
          echo "Unit test matrix passed."

  integration-test:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    needs: [changes, unit-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Skip integration tests for workflow-only changes
        if: needs.changes.outputs.code_changes != 'true'
        run: |
          echo "No build-relevant changes detected. Skipping integration tests."

      - name: Setup Nix
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-nix

      - name: Setup Zig cache
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-zig-cache
        with:
          cache-key-prefix: zig-ci-graphics

      - name: Start headless Wayland compositor
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/start-weston

      - name: Setup Lavapipe Vulkan validation
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/setup-lavapipe

      - name: Run integration smoke test
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: Integration Test
          timeout: 25m
          log-file: integration-test.log
          command: nix develop .#ci-graphics --command zig build test-integration

      - name: Run world load smoke test (headless)
        if: needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/run-with-log
        with:
          name: World Smoke Test
          timeout: 15m
          log-file: world-smoke-test.log
          command: nix develop .#ci-graphics --command zig build run -Dsmoke-test=true -Dskip-present=true
        env:
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          ZIGCRAFT_SMOKE_FRAMES: "3"
          ZIGCRAFT_SAFE_MODE: "1"

      - name: Stop headless Wayland compositor
        if: always() && needs.changes.outputs.code_changes == 'true'
        uses: ./.github/actions/stop-weston

      - name: Upload integration logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            integration-test.log
            world-smoke-test.log
            weston.log
          if-no-files-found: ignore
          retention-days: 7
