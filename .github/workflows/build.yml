name: Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build/test'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code_changes: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code_changes }}
    steps:
    - uses: actions/checkout@v4
      if: github.event_name != 'workflow_dispatch'

    - name: Detect build-relevant changes
      id: filter
      if: github.event_name != 'workflow_dispatch'
      uses: dorny/paths-filter@v4
      with:
        filters: |
          code_changes:
            - 'src/**'
            - 'libs/**'
            - 'assets/shaders/**'
            - 'build.zig'
            - 'build.zig.zon'
            - 'flake.nix'
            - 'flake.lock'
            - '.github/actions/setup-nix/**'

  build:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: changes
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Skip build for workflow-only changes
      if: needs.changes.outputs.code_changes != 'true'
      run: |
        echo "No build-relevant changes detected. Skipping binary build."

    - name: Setup Nix
      if: needs.changes.outputs.code_changes == 'true'
      uses: ./.github/actions/setup-nix

    - name: Build
      if: needs.changes.outputs.code_changes == 'true'
      run: nix build -L

    - name: Prepare Artifact
      if: needs.changes.outputs.code_changes == 'true'
      run: |
        mkdir -p dist
        cp -L result/bin/zigcraft dist/zigcraft-linux

    - name: Upload Artifact
      if: needs.changes.outputs.code_changes == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: zigcraft
        path: dist/
        retention-days: 7

  unit-test:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [changes, build]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Skip unit tests for workflow-only changes
      if: needs.changes.outputs.code_changes != 'true'
      run: |
        echo "No build-relevant changes detected. Skipping unit tests."

    - name: Setup Nix
      if: needs.changes.outputs.code_changes == 'true'
      uses: ./.github/actions/setup-nix

    - name: Run unit tests
      if: needs.changes.outputs.code_changes == 'true'
      run: nix develop --command zig build test
      env:
        ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global

  integration-test:
    permissions:
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: [changes, unit-test]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Skip integration tests for workflow-only changes
      if: needs.changes.outputs.code_changes != 'true'
      run: |
        echo "No build-relevant changes detected. Skipping integration tests."

    - name: Setup Nix
      if: needs.changes.outputs.code_changes == 'true'
      uses: ./.github/actions/setup-nix

    - name: Start headless Wayland compositor
      if: needs.changes.outputs.code_changes == 'true'
      run: |
        mkdir -p /tmp/runtime-runner
        chmod 700 /tmp/runtime-runner
        export XDG_RUNTIME_DIR=/tmp/runtime-runner
        nix develop --command weston --socket=headless --backend=headless-backend.so --width=1280 --height=720 &
        {
          echo "WAYLAND_DISPLAY=headless"
          echo "XDG_RUNTIME_DIR=/tmp/runtime-runner"
        } >> "$GITHUB_ENV"
        sleep 5

    - name: Run integration smoke test
      if: needs.changes.outputs.code_changes == 'true'
      env:
        ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
      run: |
        nix develop --command zig build test-integration

    - name: Run world load smoke test (headless)
      if: needs.changes.outputs.code_changes == 'true'
      env:
        ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache-global
        XDG_RUNTIME_DIR: /tmp/runtime-runner
        WAYLAND_DISPLAY: headless
        ZIGCRAFT_SMOKE_FRAMES: "3"
        ZIGCRAFT_SAFE_MODE: "1"
      run: |
        LVP_PATH=$(nix build --no-link --print-out-paths nixpkgs#mesa.drivers)/share/vulkan/icd.d/lvp_icd.x86_64.json
        LAYER_PATH=$(nix build --no-link --print-out-paths nixpkgs#vulkan-validation-layers)/share/vulkan/explicit_layer.d
        export VK_ICD_FILENAMES=$LVP_PATH
        export VK_LAYER_PATH=$LAYER_PATH
        nix develop --command zig build run -Dsmoke-test=true -Dskip-present=true
