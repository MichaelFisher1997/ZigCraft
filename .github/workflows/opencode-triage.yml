name: Issue Triage

on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const trustedBots = new Set([
              'opencode-agent[bot]',
              'github-actions[bot]',
            ]);
            const labels = (context.payload.issue.labels || []).map(label => label.name);

            if (trustedBots.has(context.payload.issue.user.login) || labels.includes('automated-audit')) {
              return true;
            }

            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@v4
        if: steps.check.outputs.result == 'true'
        with:
          token: ${{ github.token }}

      - name: Configure git
        if: steps.check.outputs.result == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Load triage prompt
        if: steps.check.outputs.result == 'true'
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: .github/prompts/triage.md

      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        if: steps.check.outputs.result == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          model: minimax-coding-plan/MiniMax-M3
          use_github_token: true
          prompt: ${{ env.PROMPT }}
