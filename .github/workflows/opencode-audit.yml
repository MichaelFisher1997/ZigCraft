name: opencode-audit

# Required repository secrets:
# - OPENCODE_PAT: Classic PAT with `repo` scope OR fine-grained PAT with:
#     Contents: Read, Issues: Read & Write, Pull requests: Read & Write
#   Without proper scopes, gh issue create and label operations will fail.
# - MINIMAX_API_KEY: API key for the MiniMax M3 model

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to scan (e.g. engine/graphics, world/worldgen)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.module || 'scheduled' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OPENCODE_PAT }}

      - name: Select module to scan
        id: select-module
        env:
          INPUT_MODULE: ${{ inputs.module }}
        run: bash scripts/select_audit_module.sh

      - name: Configure git identity
        run: bash scripts/configure_git_identity.sh "opencode[bot]" "opencode[bot]@users.noreply.github.com"

      - name: Setup devenv
        uses: ./.github/actions/setup-devenv

      - name: Ensure automated-audit label exists
        run: bash scripts/ensure_label.sh "automated-audit" "Issues found by automated opencode audit scans" "1D76DB"
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}

      - name: Validate module directory exists
        env:
          MODULE_PATH: ${{ steps.select-module.outputs.module_path }}
        run: bash scripts/validate_audit_module.sh

      - name: Ensure opencode cache dir exists
        run: |
          sudo chmod u+w ~/.cache 2>/dev/null || true
          bash scripts/prepare_opencode_cache.sh
          mkdir -p ~/.local/share/opencode

      - name: Load audit prompt
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: .github/prompts/audit.md
          variables: $MODULE_PATH
        env:
          MODULE_PATH: ${{ steps.select-module.outputs.module_path }}

      - name: Run opencode audit
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          XDG_CACHE_HOME: /tmp/opencode-cache
        with:
          model: minimax-coding-plan/MiniMax-M3
          use_github_token: true
          prompt: ${{ env.PROMPT }}

      - name: Compliance guard — enforce issue-only output
        if: always()
        run: bash scripts/audit_compliance_guard.sh
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
