name: opencode-test-writer

# Required repository secrets:
# - OPENCODE_PAT: Classic PAT with `repo` scope OR fine-grained PAT with:
#     Contents: Read & Write, Pull requests: Read & Write, Metadata: Read
#   Without `repo` scope, git push will fail with 403 permission denied.
# - MINIMAX_API_KEY: API key for the MiniMax M3 model

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to write tests for (e.g. graphics/vulkan-device, world/meshing)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.module || 'scheduled' }}
  cancel-in-progress: false

jobs:
  write-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      # OPENCODE_PAT must be a classic PAT with `repo` scope (full control of private repositories)
      # or a fine-grained PAT with Contents: Read & Write on this repository.
      # Without write permission, git push will fail with 403.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.OPENCODE_PAT }}

      - name: Select module to test
        id: select-module
        env:
          INPUT_MODULE: ${{ inputs.module }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/select_test_writer_module.sh

      - name: Configure git identity
        run: bash scripts/configure_git_identity.sh "opencode[bot]" "opencode[bot]@users.noreply.github.com"

      - name: Ensure test label exists
        run: bash scripts/ensure_label.sh "automated-test" "Test PRs created by automated opencode test writer" "0E8A16"
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}

      - name: Check for existing automated test PRs
        id: check-existing
        env:
          INPUT_MODULE: ${{ inputs.module }}
          BASE_BRANCH: ${{ steps.select-module.outputs.base_branch }}
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: bash scripts/check_existing_test_prs.sh

      - name: Validate scan paths exist
        if: steps.check-existing.outputs.skip != 'true'
        env:
          SCAN_PATHS: ${{ steps.select-module.outputs.scan_paths }}
        run: bash scripts/validate_scan_paths.sh

      - name: Verify PAT push permissions
        if: steps.check-existing.outputs.skip != 'true'
        env:
          BASE_BRANCH: ${{ steps.select-module.outputs.base_branch }}
        run: bash scripts/verify_pat_push_permissions.sh

      - name: Setup devenv
        if: steps.check-existing.outputs.skip != 'true'
        uses: ./.github/actions/setup-devenv

      - name: Load test writer prompt
        if: steps.check-existing.outputs.skip != 'true'
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: .github/prompts/test-writer.md
          variables: $MODULE $DEFAULT_BRANCH $SCAN_PATHS
        env:
          MODULE: ${{ steps.select-module.outputs.module }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_PATHS: ${{ steps.select-module.outputs.scan_paths }}

      - name: Run opencode test writer
        if: steps.check-existing.outputs.skip != 'true'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          XDG_CACHE_HOME: /tmp/opencode-cache
        with:
          model: minimax-coding-plan/MiniMax-M3
          use_github_token: true
          prompt: ${{ env.PROMPT }}

      - name: Find and label created PR
        if: steps.check-existing.outputs.skip != 'true'
        run: bash scripts/label_created_test_pr.sh
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
