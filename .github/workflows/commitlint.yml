name: Commit Conventions

on:
  pull_request:
    branches: [dev]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|ci|chore|perf|build|style|revert)(\([A-Za-z0-9_.-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use a conventional commit prefix. See CONTRIBUTING.md#3-commit-changes."
            echo "Allowed types: feat, fix, refactor, test, docs, ci, chore, perf, build, style, revert."
            exit 1
          fi

  commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|ci|chore|perf|build|style|revert)(\([A-Za-z0-9_.-]+\))?!?: .+'
          failures=0
          while IFS= read -r subject; do
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "Invalid commit subject: $subject"
              failures=1
            fi
          done < <(git log --format=%s "$BASE_SHA..$HEAD_SHA")

          if [[ "$failures" -ne 0 ]]; then
            echo "Commit subjects must follow CONTRIBUTING.md#3-commit-changes."
            exit 1
          fi
