name: Workflow Validation

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/*.sh'
      - '.shellcheckrc'
      - 'flake.nix'
  pull_request:
    branches: [ dev ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/*.sh'
      - '.shellcheckrc'
      - 'flake.nix'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yaml-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Parse composite action YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/actions/**/action.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Check shell script syntax
        run: nix develop .#ci-unit --command bash -n scripts/*.sh

      - name: Run ShellCheck
        run: nix develop .#ci-unit --command shellcheck scripts/*.sh
