name: visual-test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Start headless Wayland compositor
        uses: ./.github/actions/start-weston

      - name: Prepare opencode cache
        run: |
          mkdir -p /tmp/opencode-cache
          echo "XDG_CACHE_HOME=/tmp/opencode-cache" >> "$GITHUB_ENV"

      - name: Load visual verification prompt
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: .github/prompts/visual-test-verify.md
          env-var: VISUAL_VERIFY_PROMPT

      - name: Load visual diagnosis prompt
        uses: ./.github/actions/load-prompt
        with:
          prompt-file: .github/prompts/visual-test-diagnose.md
          env-var: VISUAL_DIAGNOSE_PROMPT
          variables: $WORKFLOW_URL
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Ensure visual-test label exists
        run: |
          if ! gh label list --json name --jq '.[].name' | grep -q '^visual-test$'; then
            gh label create "visual-test" \
              --description "Issues from automated visual regression tests" \
              --color "E06C75"
          fi
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}

      - name: Setup Lavapipe Vulkan
        uses: ./.github/actions/setup-lavapipe

      - name: Run menu screenshot capture
        id: screenshot
        continue-on-error: true
        uses: ./.github/actions/run-with-log
        with:
          name: Visual Test
          timeout: 20m
          log-file: build-output.log
          command: nix develop .#ci-graphics --command zig build run -Dscreenshot-path=screenshot.ppm -Dskip-present=true
        env:
          ZIG_GLOBAL_CACHE_DIR: /tmp/zig-cache-global
          XDG_RUNTIME_DIR: /tmp/runtime-runner
          WAYLAND_DISPLAY: headless
          ZIGCRAFT_SMOKE_FRAMES: "5"
          ZIGCRAFT_SAFE_RENDER: "1"

      - name: Convert PPM to PNG
        id: convert
        if: always()
        run: |
          if [ -f screenshot.ppm ]; then
            nix run nixpkgs#imagemagick -- screenshot.ppm screenshot.png
            echo "screenshot_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "screenshot_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload screenshot artifact
        if: steps.convert.outputs.screenshot_exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: menu-screenshot
          path: |
            screenshot.png
            screenshot.ppm
          retention-days: 30

      - name: Check build log exists
        id: check_log
        if: always()
        run: 'test -f build-output.log && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"'

      - name: Upload build log artifact
        if: always() && steps.check_log.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-output-log
          path: |
            build-output.log
            weston.log
          retention-days: 7

      - name: Stop headless Wayland compositor
        if: always()
        uses: ./.github/actions/stop-weston

      - name: Run opencode visual verification
        if: steps.convert.outputs.screenshot_exists == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          model: minimax-coding-plan/MiniMax-M3
          prompt: ${{ env.VISUAL_VERIFY_PROMPT }}

      - name: Run opencode failure diagnosis
        if: failure() || steps.screenshot.outcome == 'failure' || steps.convert.outputs.screenshot_exists != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          model: minimax-coding-plan/MiniMax-M3
          prompt: ${{ env.VISUAL_DIAGNOSE_PROMPT }}
