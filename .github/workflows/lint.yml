name: Lint

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose-and-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Lint Markdown
        run: bunx markdownlint-cli2

      - name: Check JSON and YAML formatting
        run: bunx prettier --check "**/*.{json,jsonc,yml,yaml}"
